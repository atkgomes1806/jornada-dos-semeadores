<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sua Leitura de Cartas</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/skeleton.css">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Botão de Alternância de Modo Escuro -->
  <div id="dark-mode-toggle" class="dark-mode-toggle">
    <span class="icon-sun">☀️</span>
    <span class="icon-moon">🌙</span>
  </div>

  <!-- Tela de Carregamento/Mentalização -->
  <div id="loading-overlay">
    <div class="loading-spinner"></div>
    <p class="loading-message">agora, feche os olhos, respire fundo e mentalize!</p>
  </div>

  <div id="category-modal" class="modal">
    <div class="modal-content">
      <h2>Escolha até 3 áreas para sua leitura:</h2>
      <form id="category-form">
        <div class="category-grid">
          <label><input type="checkbox" name="categoria" value="Autoconhecimento"> Autoconhecimento</label>
          <label><input type="checkbox" name="categoria" value="Saúde"> Saúde</label>
          <label><input type="checkbox" name="categoria" value="Amor"> Amor</label>
          <label><input type="checkbox" name="categoria" value="Amizades"> Amizades</label>
          <label><input type="checkbox" name="categoria" value="Família"> Família</label>
          <label><input type="checkbox" name="categoria" value="Trabalho"> Trabalho</label>
          <label><input type="checkbox" name="categoria" value="Dinheiro"> Dinheiro</label>
          <label><input type="checkbox" name="categoria" value="Decisões"> Decisões</label>
        </div>
        <button type="submit" id="start-draw-btn">Sortear Cartas</button>
      </form>
    </div>
  </div>

  <a href="index.html" class="home-link" aria-label="Voltar ao início">
    <span class="home-icon">🏠</span>
  </a>
  <!-- O título será inserido dinamicamente pelo script -->
  <div id="container"></div>
  
  <script src="js/cartas.js"></script>
  <script src="js/script.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
